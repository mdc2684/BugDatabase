name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install flask pytest flake8
      - name: Lint
        run: flake8 app.py --max-line-length=120 --statistics || true
      - name: Import smoke test
        run: python -c "import app" || true
